name: cazymeseek
channels: [conda-forge, bioconda, defaults]
dependencies:
  # Published protocol stack: PDF Materials and S3.
  - python=3.9
  - megahit=1.2.9
  - trim-galore=0.6.0
  - kraken2=2.1.1
  - prokka=1.14
  - bwa=0.7.17
  - samtools=1.7
  - hmmer=3.3                 # Provides hmmsearch.
  - diamond=2.1.8
  - blast=2.14
  - bedtools=2.27.1
  - seqkit=2.5.1
  - mmseqs2=15
  - pip
  - pip:
      - run-dbcan==4.0.0
      - chromadb
      - sentence-transformers
      - pandas
      - matplotlib
      - seaborn
      - pyyaml
