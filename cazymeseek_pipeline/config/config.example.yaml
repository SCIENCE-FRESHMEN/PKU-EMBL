# CAZymeSeek/dbCAN configuration. Source tags refer to 2024.01.10.575125v1.full.pdf.
paths:
  # Project root; output/ and logs are created underneath this directory.
  project_dir: /data/cazymeseek_pipeline
  # TSV columns: sample_id, read1, read2. [dbCAN PDF, Table 2 and P1--P2]
  samples_tsv: /data/cazymeseek_pipeline/config/samples.tsv
  # run_dbcan HMM/CAZy/dbCAN-sub/dbCAN-PUL data directory. [dbCAN PDF, S4]
  dbcan_db_dir: /data/dbcan_db
  # Kraken2 reference database; only used for contamination assessment. [P1]
  kraken_db_dir: /data/kraken2_db
  # Supplied four ChromaDB stores + models/all-MiniLM-L6-v2. [CAZymeSeek asset README]
  vector_db_dir: /data/cazymeseek_pipeline/vector_db

resources:
  # Paper reference host: 40 CPUs and 128 GB RAM; use one individual sample at once.
  threads: 40
  memory_gb: 128

assembly:
  # individual is implemented. coassembly and assembly_free are documented in README
  # because the PDF describes different data paths and does not support substituting one for another.
  mode: individual                 # individual | coassembly | assembly_free
  # Published P3 example uses 1,000 bp and MEGAHIT -m 0.5.
  min_contig_len: 1000
  megahit_memory_fraction: 0.5

contamination_removal:
  # P1 requires first identifying a contamination source; Carter2023 did not require removal.
  enabled: false
  reference_fasta: /data/references/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz

tools:
  trim_galore: trim_galore
  kraken2: kraken2
  megahit: megahit
  prokka: prokka
  run_dbcan: run_dbcan
  bwa: bwa
  samtools: samtools
  bedtools: bedtools
  seqkit: seqkit
  dbcan_utils: dbcan_utils
  mmseqs: mmseqs

annotation:
  # 新增修复1：严格固定的裁决顺序与权重。不得改变为无差别合并。
  source_priority:
    hmmer: 0
    hotpep: 1
    diamond: 2
  # 新增修复4：同 gene_id 的两个域，交叠比例 >= 0.80 时视为同一域，保留较小 source_rank。
  domain_overlap_threshold: 0.80
  # 可选 legacy Hotpep TSV；dbCAN4 已用 eCAMI/dbCAN-sub 取代 Hotpep，默认留空。
  hotpep_output: ""
  # 可选策展 subfamily/family -> EC TSV；为空时读取 dbcan-sub.hmm.out 内的 EC 字段。
  ec_mapping_tsv: ""

pul_voting:
  # 问题8：原始 run_dbcan PUL 同源/多数投票策略不被本工程修改。
  # 本配置仅记录和透传研究使用的阈值，不能重写已生成 substrate.out 的候选投票结果。
  enabled: true
  majority_vote_threshold: null

deduplication:
  # 【新增修复5】默认关闭(false)：严格执行论文 P13 的全 CDS + dbcan_utils TPM。
  # 开启(true)：先用 MMseqs2 将高度同源蛋白归并为代表序列，再对对应 FFN 代表 CDS 回贴；
  # 结果附带 protein_cluster_id，适合需要降低冗余基因重复计数的项目比较。
  # 注意：此模式是 CAZymeSeek 的可选定量扩展，不能替代原始 dbcan_utils 家族/CGC 汇总结果。
  enabled: false                 # 推荐默认 false；确认需要代表序列簇定量时改为 true。
  # MMseqs2 --min-seq-id；论文 Box 8 的非冗余蛋白目录示例为 identity > 0.95。
  min_seq_identity: 0.95
  # MMseqs2 -c 覆盖度；论文 Box 8 示例为 coverage > 0.95。
  coverage: 0.95

retrieval:
  # Project assets provide cosine distance but no score cutoff; retain all top-k evidence.
  top_k: 3
  semantic_confidence_threshold: null

evidence:
  # Reporting labels are transparent project conventions, not a threshold defined in either PDF.
  # A: dbCAN-sub EC plus subfamily or dbCAN-PUL substrate; B: family annotation evidence; C: retrieval/vote only.
  confidence_thresholds: null

visualization:
  formats: [png, pdf]
  png_dpi: 300
  top_n: 20                       # Fig. 6 examples show top 20 families/substrates.
